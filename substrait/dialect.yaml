      definition_kind: WINDOW_FUNCTION
      sql_signature: session_window(gap_amount, gap_unit) OVER (... ORDER BY timestamp ASC)
      plan_representation: CONSISTENT_PARTITION_WINDOW
      requires_order_by: true
      frame_types: []
      supports_filter: false
      sql_distinct: false
      requires_bulk_window_operator: true
      order_by_count: 1
      order_by_direction: ASC
      order_by_type: precision_timestamp_tz<7>
      literal_arguments:
