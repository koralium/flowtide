# Window functions
# Execute through ConsistentPartitionWindowRel, not the general WINDOW_FUNCTION expression form.
# Aggregate definitions can also be referenced here where their value/return contract matches.
# ROWS frames use literal row offsets. RANGE/GROUPS, dynamic frame bounds, FILTER and DISTINCT are not supported.
supported_window_functions:
  - source: arithmetic
    name: row_number
    system_metadata:
      name: row_number
      notation: FUNCTION
    supported_impls:
      - ''
    metadata:
      runtime_extension_urn: extension:io.substrait:functions_arithmetic
      definition_kind: WINDOW_FUNCTION
      sql_signature: row_number() OVER (...)
      plan_representation: CONSISTENT_PARTITION_WINDOW
      requires_order_by: true
      frame_types: []
      supports_filter: false
      sql_distinct: false
      notes: Numbers rows from 1 within each partition. SQL requires ORDER BY and rejects ROWS frames. Include a
        stable tie breaker in ORDER BY when row positions must be deterministic. Do not pass arguments.
      sql_example: SELECT row_number() OVER (PARTITION BY p ORDER BY o, unique_key) FROM t
      doc_url: https://koralium.github.io/flowtide/docs/expressions/windowfunctions/arithmetic.html
  - source: arithmetic
    name: sum
    system_metadata:
      name: sum
      notation: FUNCTION
    supported_impls:
      - i64
      - fp64
    required_options:
      overflow: SILENT
    metadata:
      runtime_extension_urn: extension:io.substrait:functions_arithmetic
      definition_kind: AGGREGATE_FUNCTION
      sql_signature: sum(x) OVER (...)
      plan_representation: CONSISTENT_PARTITION_WINDOW
      requires_order_by: false
      frame_types:
        - ROWS
      supports_filter: false
      sql_distinct: false
      frame_bounds: &id001
        - UNBOUNDED_PRECEDING
        - PRECEDING
        - CURRENT_ROW
        - FOLLOWING
        - UNBOUNDED_FOLLOWING
      bound_offsets: NONNEGATIVE_INTEGER_LITERALS
      default_frame:
        with_order_by: ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
        without_order_by: ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING
      notes: Null input values are ignored; empty/all-null frames return null. Without ORDER BY, SQL uses the whole
        partition. With ORDER BY and no explicit frame, SQL uses ROWS UNBOUNDED PRECEDING through CURRENT ROW, including
        only rows through this physical row rather than all equal-order peers. Explicit ROWS bounds support preceding/following/current/unbounded
        endpoints. RANGE, GROUPS and dynamic frame-bound expressions are not implemented. Uses the aggregate definition
        as a window function.
      sql_example: SELECT sum(x) OVER (PARTITION BY p ORDER BY o ROWS BETWEEN 4 PRECEDING AND CURRENT ROW) FROM
        t
      doc_url: https://koralium.github.io/flowtide/docs/expressions/windowfunctions/arithmetic.html
