        expression is required. A neighbouring gap equal to the limit remains in the session; a larger gap starts
        a new one. Null/non-timestamp sort values return null and do not split the run. Inserts can merge sessions
        and deletes can split them. The gap is a positive integer literal and a string unit literal; WEEK/DAY are
