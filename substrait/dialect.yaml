# Aggregate functions
# Execution consumes raw input and produces final results (INITIAL_TO_RESULT).
# Partial-state phases, invocation flags and aggregate sort fields are not represented by the native model.
# FILTER is supported per measure. COUNT(DISTINCT x) uses the dedicated count_distinct binding.
supported_aggregate_functions:
  - source: aggregate_generic
    name: count
    system_metadata:
      name: count
      notation: FUNCTION
    supported_impls:
      - any
      - ''
    required_options:
      overflow: SILENT
    metadata:
      runtime_extension_urn: extension:io.substrait:functions_aggregate_generic
      sql_signature: COUNT(*)
      aggregation_phase: INITIAL_TO_RESULT
      supports_filter: true
      sql_count_expression: false
      notes: The zero-argument binding counts rows. The one-argument native binding counts non-null values, but
        ordinary SQL COUNT(x) is currently rejected by the SQL planner; SQL accepts COUNT(*) and COUNT(DISTINCT
        x). Empty input returns Int64 zero. The DISTINCT form uses the separate count_distinct binding.
      doc_url: https://koralium.github.io/flowtide/docs/expressions/aggregatefunctions/generic.html
  - source: flowtide_aggregate_generic
    name: count_distinct
    system_metadata:
      name: count
      notation: FUNCTION
    supported_impls:
      - any
    metadata:
      runtime_extension_urn: extension:io.github.koralium.flowtide:functions_aggregate_generic
      sql_signature: COUNT(DISTINCT x)
      aggregation_phase: INITIAL_TO_RESULT
      supports_filter: true
      sql_distinct: true
      notes: Counts distinct non-null values; empty/all-null groups return Int64 zero. This is an exact stateful
        aggregate with one expression argument, not an approximate distinct count.
      doc_url: https://koralium.github.io/flowtide/docs/expressions/aggregatefunctions/generic.html
  - source: flowtide_aggregate_generic
    name: surrogate_key_int64
    system_metadata:
