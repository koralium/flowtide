name: "Flowtide dialect"

metadata:
  max_expression_depth: 128
  flowtide_type_compatibility:
    declaration_scope: supported_types describes native value/model capabilities. Each entry separately states schema
      and non-null literal wire support; a native type declaration alone does not imply that every schema/literal
      form can be imported.
    nullability: Native columns store nulls separately from value kinds. Required schema annotations are not a row-validation
      step. For supported scalar/LIST/MAP schema paths, nullability annotations are retained; any imports as nullable,
      and standard nested STRUCT container nullability is not retained. Typed protobuf null literals import as an untyped NullLiteral and lose
      their original type annotation.
    type_variations: Only default type behavior is advertised. Type-variation references are not preserved or enforced
      by the current model/reader/writer.
    numeric_string_cast_culture: Numeric string casts use the process .NET culture (TryParse without an explicit provider);
      format numeric strings for that culture.
    additional_model_types:
      - native_model: DateType
        protobuf_type: DATE
        schema_import: true
        schema_export: true
        non_null_literal_import: false
        native_cast: false
        notes: DATE schema annotations are accepted, but there is no dedicated native date value/cast implementation.
          CLR DateTime uses TimestampType. DATE is therefore not advertised as a complete runtime value type.
      - native_model: NullType
        runtime_value: NullValue
        protobuf_codec: nullable Flowtide any
        notes: NullType serializes as nullable any and imports as AnyType. Null values are supported through nullable/dynamic
          types rather than a separate standard NULL type class.
    unsupported_standard_type_classes:
      - I8
      - I16
      - FIXED_BINARY
      - VARCHAR
      - FIXED_CHAR
      - DATE
      - PRECISION_TIME
      - PRECISION_TIMESTAMP
      - INTERVAL_COMPOUND
      - INTERVAL_DAY
      - INTERVAL_YEAR
      - UUID
      - UNBOUND
      - FUNC
  # Table functions are Flowtide metadata, not a standard Substrait function section.
  flowtide_table_functions:
    description: Flowtide-specific metadata. Neither the dialect schema nor Simple Extensions defines a standard table-function
      catalog. Definitions are stored in each source extension metadata.table_functions.
    plan_representation:
      protobuf_type: flowtide.TableFunctionRelation
      type_url: type.googleapis.com/flowtide.TableFunctionRelation
      with_input: EXTENSION_SINGLE
      without_input: EXTENSION_LEAF
      requires_table_schema: true
      argument_kind: VALUE
      sql_join_types:
        - INNER
        - LEFT
      notes: Function references use ordinary extension URI/name anchors. Supply TableFunction.table_schema with the
        correct number of output columns. With input, argument expressions can reference that input row and output
        fields append the function columns to the input before emit projection. An optional ON predicate can reference
        both input and function columns. INNER JOIN retains only matching function rows; LEFT JOIN emits one row with
        null function columns if no rows match, including an empty function result or an ON predicate rejecting every
        row. SQL does not support RIGHT/FULL/CROSS joins for these built-in table functions. Standalone FROM calls
        execute without input and emit their static result as a source.
    supported_functions:
      - source: flowtide_table_generic
        name: unnest
        system_metadata:
          name: unnest
          notation: FUNCTION
        supported_impls:
          - list
          - map
        metadata:
          runtime_extension_urn: extension:io.github.koralium.flowtide:functions_table_generic
          sql_signature: unnest(collection)
          sql_examples:
            - SELECT val FROM UNNEST(list(1, 2, 3)) val
            - SELECT d.id, element FROM documents d LEFT JOIN UNNEST(d.items) element
            - SELECT d.id, element FROM documents d INNER JOIN UNNEST(d.items) element ON element = 123
          doc_url: https://koralium.github.io/flowtide/docs/expressions/tablefunctions/generic.html
      - source: flowtide_datetime
        name: tumbling_window
        system_metadata:
          name: tumbling_window
          notation: FUNCTION
        supported_impls:
          - ptstz_i64_str
        metadata:
          runtime_extension_urn: extension:io.github.koralium.flowtide:functions_datetime
          sql_signature: tumbling_window(timestamp, size_amount, size_unit)
          sql_examples:
            - SELECT o.id, window_start, window_end FROM orders o INNER JOIN tumbling_window(o.order_time, 10, 'MINUTE')
            - SELECT window_start, COUNT(*) FROM orders o INNER JOIN tumbling_window(o.order_time, 10, 'MINUTE') GROUP
              BY window_start
          doc_url: https://koralium.github.io/flowtide/docs/expressions/tablefunctions/datetime.html
      - source: flowtide_datetime
        name: hopping_window
        system_metadata:
          name: hopping_window
          notation: FUNCTION
        supported_impls:
          - ptstz_i64_str_i64_str
        metadata:
          runtime_extension_urn: extension:io.github.koralium.flowtide:functions_datetime
          sql_signature: hopping_window(timestamp, hop_amount, hop_unit, size_amount, size_unit)
          sql_examples:
            - SELECT o.id, window_start, window_end FROM orders o INNER JOIN hopping_window(o.order_time, 5, 'MINUTE',
              10, 'MINUTE')
            - SELECT o.id, window_start FROM orders o LEFT JOIN hopping_window(o.order_time, 10, 'MINUTE', 5, 'MINUTE')
          doc_url: https://koralium.github.io/flowtide/docs/expressions/tablefunctions/datetime.html

supported_expressions:
  - expression: LITERAL
    metadata:
      notes: Protobuf import accepts boolean, null, i32, i64, string, fixed_char and binary literals. Fractional
        NumericLiteral values in native plans execute as doubles and serialize as fp64, but fp64 literal import
        is not implemented. Use NESTED LIST/MAP for collection construction; collection literals are not supported
        by the protobuf literal reader.
  - expression: SELECTION
    metadata:
      notes: Use a direct StructField reference with a zero-based input column index. RootReference selects
        from the current input; OuterReference is used for correlated EXISTS filters and must be removed by
        decorrelation before execution. Masked references and expression-rooted selections are unsupported.
        Child reference segments are not preserved by the protobuf reader/writer, even though native plans
        can access nested fields.
  - expression: SCALAR_FUNCTION
    metadata:
      notes: Calls resolve through registered extension URI/name pairs. Availability depends on the engine's
        function registry; this expression form does not imply support for every function in a Substrait extension.
  - expression: IF_THEN
    metadata:
      notes: 'Searched CASE semantics: evaluate conditions in order and return the first matching result. Supply
        an explicit else expression when importing a plan; use a null literal for CASE without an ELSE clause.'
  - expression: SINGULAR_OR_LIST
    metadata:
      notes: Tests one value against a list of expression options, using equality comparisons combined with
        boolean OR and SQL null semantics. This is the expression form used for SQL IN lists.
  - expression: CAST
    failure_options:
      - RETURN_NULL
    metadata:
      notes: The serializer emits RETURN_NULL. Invalid string conversions and incompatible input value kinds
        return null. Numeric-to-integer casts truncate fractional parts toward zero; numeric overflow is not
        uniformly handled and can still throw. The importer does not retain the protobuf failure behavior,
        so THROW_EXCEPTION cannot be requested reliably.
  - expression: SUBQUERY
    subquery_types:
      - SET_PREDICATE
    metadata:
      notes: Only the EXISTS set-predicate operation is supported, in filter conditions. NOT EXISTS wraps it
        in boolean NOT. The plan optimizer decorrelates these expressions into mark joins before execution.
        SQL IN/NOT IN subqueries are lowered by the SQL planner rather than imported as IN_PREDICATE. SCALAR
        and SET_COMPARISON are unsupported.
  - expression: NESTED
    nested_types:
      - LIST
      - MAP
    metadata:
      notes: Construct lists and maps from child expressions. STRUCT is supported as a virtual-table row container,
        but is not compiled as a general nested expression; use the registered named_struct scalar function
        to construct struct-valued columns.


