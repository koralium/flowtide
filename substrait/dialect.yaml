  - source: flowtide_aggregate_generic
    name: surrogate_key_int64
    system_metadata:
      name: surrogate_key_int64
      notation: FUNCTION
    supported_impls:
      - ''
    metadata:
      runtime_extension_urn: extension:io.github.koralium.flowtide:functions_aggregate_generic
      definition_kind: WINDOW_FUNCTION
      sql_signature: surrogate_key_int64() OVER (...)
      plan_representation: CONSISTENT_PARTITION_WINDOW
      requires_order_by: false
      frame_types: []
      supports_filter: false
      sql_distinct: false
      deterministic: false
      notes: One stateful counter key per partition, shared by all its rows. Without PARTITION BY, all rows share
        one key. ORDER BY is optional; SQL rejects ROWS frames. Live partitions retain their key across updates
        and checkpoint restore; deleting and recreating a partition can assign a new key. Allocation is operator-scoped
        and not deterministic across a full replay.
