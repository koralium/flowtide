supported_scalar_functions:
  - source: arithmetic
    name: add
    system_metadata:
      name: +
      notation: INFIX
    required_options:
      overflow: SILENT
    supported_impls: [i64_i64]
    metadata:
      runtime_extension_urn: extension:io.substrait:functions_arithmetic
      sql_signature: x + y
      notes: >-
        Int64 arithmetic wraps on overflow. Narrow integer and FP32 overloads are not declared because the runtime
        widens those values.
      doc_url: https://koralium.github.io/flowtide/docs/expressions/scalarfunctions/arithmetic.html
  - source: arithmetic
    name: add
    system_metadata:
      name: +
      notation: INFIX
    required_options:
      rounding: TIE_TO_EVEN
    supported_impls: [fp64_fp64]
    metadata:
      runtime_extension_urn: extension:io.substrait:functions_arithmetic
      sql_signature: x + y
      notes: >-
        Double arithmetic with the runtime IEEE-754 rounding policy. Other rounding modes are not implemented.
      doc_url: https://koralium.github.io/flowtide/docs/expressions/scalarfunctions/arithmetic.html
