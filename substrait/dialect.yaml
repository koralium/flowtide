      notes: Return x from a following row in the same partition, defaulting to offset 1. Negative offsets reverse
        direction and zero selects the current row. A missing target yields the provided default, evaluated on the
        current row, or null when omitted. Null target values are respected. SQL requires ORDER BY and rejects ROWS
        frames; IGNORE NULLS is not implemented. Native offsets are Int64 and may be expressions. A null offset
        is treated as 1, unlike upstream. The default can have a different value kind; that overload has an opaque/dynamic
        result.
      sql_example: SELECT lead(x, 2, x) OVER (PARTITION BY p ORDER BY o) FROM t
      doc_url: https://koralium.github.io/flowtide/docs/expressions/windowfunctions/arithmetic.html
