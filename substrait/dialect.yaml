      notes: Dynamically typed numeric avg for any inputs. The runtime chooses the numeric value kind from input values. Null and incompatible inputs are ignored; empty/all-null frames return null. Explicit ROWS frames use integer literal bounds. Without ORDER BY the whole partition is used; otherwise the default frame ends at the current row. RANGE, GROUPS, FILTER and DISTINCT are unsupported.
      doc_url: https://koralium.github.io/flowtide/docs/expressions/windowfunctions/arithmetic.html

# Relations
# Lists executable protobuf relation forms, with known import/export restrictions in metadata.
# Native SQL/model capabilities that exceed protobuf support are documented in the relevant entries.
supported_relations:
  - relation: READ
    read_types:
      - NAMED_TABLE
      - VIRTUAL_TABLE
    metadata:
      requires_base_schema: true
      virtual_table_encoding: EXPRESSIONS
      imports_read_filter: false
      imports_projection_mask: false
      notes: Named tables resolve through configured source connectors. Supply a base_schema with column names and
        types. Virtual tables use ReadRel.virtual_table.expressions (Struct expressions); the legacy values field
        is not read. ReadRel.filter and projection masks are not imported, so express required predicates with FILTER
        and output selection with common.emit or PROJECT. Local-file, extension-table and Iceberg ReadRel forms
        are not implemented.
  - relation: FILTER
    metadata:
      notes: A condition expression is required. Rows whose condition evaluates to true pass through; false and
        null are rejected. Supports common.emit output mappings and incremental insert/retract weights. Use this
        relation for predicates that must survive protobuf import instead of ReadRel.filter.
      doc_url: https://koralium.github.io/flowtide/docs/operators/filter.html
  - relation: PROJECT
    metadata:
      output_layout: INPUT_COLUMNS_THEN_EXPRESSIONS
      notes: Expressions append columns to the input schema; use common.emit to select/reorder input and computed
        columns. Field indices are zero-based and refer to the input schema. Supported expression forms and function
        bindings are listed in the expression/scalar catalogs.
      doc_url: https://koralium.github.io/flowtide/docs/operators/projection.html
  - relation: JOIN
    join_types:
      - INNER
      - LEFT
      - RIGHT
      - LEFT_MARK
    metadata:
      native_join_types:
        - INNER
        - LEFT
        - RIGHT
        - OUTER
        - LEFT_MARK
      predicate_reference_schema: LEFT_COLUMNS_THEN_RIGHT_COLUMNS
      roundtrip_post_join_filter: false
      notes: 'The protobuf importer accepts INNER, LEFT, RIGHT and LEFT_MARK. Native SQL/model plans also support
        OUTER; importing a generic JoinRel with OUTER throws. The optimizer may lower suitable keyed joins to MERGE_JOIN;
        other predicates use the block-nested join operator. Predicate field references use the concatenated left/right
        schema. LEFT_MARK outputs left columns plus a boolean mark. For reliable export, leave PostJoinFilter unset:
        the generic JoinRel serializer currently writes it into expression, replacing the original join predicate.
        Express post-join filtering as a separate FILTER relation.'
      doc_url: https://koralium.github.io/flowtide/docs/operators/join.html
  - relation: MERGE_JOIN
    join_types:
      - INNER
      - LEFT
      - RIGHT
      - OUTER
      - LEFT_MARK
    metadata:
      key_reference_kind: DIRECT_TOP_LEVEL_STRUCT_FIELD
      right_key_index_base: LEFT_OUTPUT_LENGTH
      key_comparisons:
        - EQ
        - LT
        - LTE
        - GT
        - GTE
      notes: Supports keyed incremental joins, including OUTER and LEFT_MARK. Use direct top-level StructField key
        references; flatten nested keys with PROJECT first. Flowtide stores right-key field indices in the combined
        schema (left.output_length + right column index), and its wire importer/exporter retain those indices without
        rebasing. EQ uses a simple comparison key; LT/LTE/GT/GTE are represented by custom comparison-function references.
        Other custom comparison names fall back to EQ and are not advertised. Residual post_join_filter and common.emit
        are retained. Physical input need not already be sorted; the runtime maintains indexed state.
      doc_url: https://koralium.github.io/flowtide/docs/operators/join.html
  - relation: AGGREGATE
    metadata:
      max_grouping_sets: 1
      supports_measure_filters: true
      aggregation_phases:
        - INITIAL_TO_RESULT
      imports_common_emit: false
      output_layout: GROUPING_EXPRESSIONS_THEN_MEASURES
      notes: Supports global aggregation or one grouping set containing multiple expressions. Multiple grouping
        sets are rejected. Outputs grouping columns followed by measures; per-measure FILTER is supported. Grouping-only
        aggregation with no measures is supported. Aggregate bindings are listed in supported_aggregate_functions.
        The native model executes raw input to final results; protobuf phase, invocation and aggregate sort fields
        are not retained. COUNT(DISTINCT x) uses the dedicated count_distinct binding. The importer also drops AggregateRel.common.emit,
        so use PROJECT above the aggregate to apply an output mapping after import.
      doc_url: https://koralium.github.io/flowtide/docs/operators/aggregate.html
  - relation: SET
    operations:
      - UNION_ALL
    metadata:
      imports_operation: false
      native_operations:
        - UNION_ALL
        - UNION_DISTINCT
        - MINUS_PRIMARY
        - MINUS_PRIMARY_ALL
        - INTERSECTION_MULTISET
        - INTERSECTION_MULTISET_ALL
      max_inputs_for_native_stateful_operations: 8
      notes: The wire importer currently sets every SetRel operation to UNION_ALL, regardless of op. Only UNION_ALL
        is advertised for protobuf plans. Native SQL/model execution additionally supports UNION_DISTINCT, MINUS_PRIMARY,
        MINUS_PRIMARY_ALL, INTERSECTION_MULTISET and INTERSECTION_MULTISET_ALL. Those stateful native operations
        accept one through eight inputs; UNION_ALL uses a separate operator. Inputs must have the same column count.
        The serializer also leaves op unspecified for the native MINUS_PRIMARY_ALL and INTERSECTION_MULTISET_ALL
        variants. Use explicit grouping of all output columns for distinct results in an imported plan.
      doc_url: https://koralium.github.io/flowtide/docs/operators/set.html
  - relation: REFERENCE
    metadata:
      imports_common_emit: false
      notes: ReferenceRel.subtree_ordinal refers to a relation in the plan relation list. The importer resolves
        its output length from the referenced relation; the runtime shares that relation rather than building another
        copy. Common.emit is not imported for references; use PROJECT for output mapping.
  - relation: WRITE
    write_types:
      - NAMED_TABLE
    metadata:
      requires_sink_connector: true
      enhancement_types:
        - type.googleapis.com/flowtide.WriteRelationPrimaryKeys
      notes: Writes a named table through a configured sink connector. Supply table_schema and named_table. CreateMode.REPLACE_IF_EXISTS
        maps to the native Overwrite flag; actual overwrite and update behavior depends on the connector. Flowtide
        primary-key names can be supplied through the flowtide.WriteRelationPrimaryKeys advanced-extension enhancement.
        Unknown enhancement message types are rejected. Supports common.emit; generic update/DDL relations are separate
        unsupported forms.
  - relation: CONSISTENT_PARTITION_WINDOW
    metadata:
      function_catalog: supported_window_functions
      frame_types:
        - ROWS
      output_layout: INPUT_COLUMNS_THEN_WINDOW_RESULTS
      notes: Partition and ordering expressions apply to a list of window functions. Input columns are followed
        by window result columns before common.emit. Supported functions, ordering requirements and ROWS frames
        are listed in supported_window_functions. The column-store runtime requires a bulk implementation for every
        window function in the relation and at least one function. This relation is distinct from a general WINDOW_FUNCTION
        expression, which is not imported.
      doc_url: https://koralium.github.io/flowtide/docs/operators/window.html
  - relation: EXCHANGE
    kinds:
      - SCATTER_BY_FIELDS
      - BROADCAST
    metadata:
      target_uris:
        - standard_output
      target_extension_types:
        - type.googleapis.com/flowtide.SubstreamExchangeTarget
        - type.googleapis.com/flowtide.PullBucketExchangeTarget
      notes: Supports scatter-by-field and broadcast distribution. Scatter fields are field references. Targets
        are the reserved URI standard_output, or Flowtide SubstreamExchangeTarget/PullBucketExchangeTarget extension
        messages. Partition ids, target ids and substream names must match the receiving exchange references and
        configured stream graph. A zero/absent partition_count imports as unspecified. Other exchange kinds and
        target URI forms are rejected.
  - relation: EXTENSION_SINGLE
    message_types:
      - type.googleapis.com/flowtide.SubStreamRootRelation
      - type.googleapis.com/flowtide.TableFunctionRelation
      - type.googleapis.com/flowtide.TopNRelation
      - type.googleapis.com/flowtide.BufferRelation
      - type.googleapis.com/flowtide.CheckRelation
    metadata:
      messages:
        flowtide.SubStreamRootRelation:
          native_relation: SubStreamRootRelation
          notes: Names a substream boundary around the input. Use a stream graph configured for the matching substream.
        flowtide.TableFunctionRelation:
          native_relation: TableFunctionRelation
          join_types:
            - INNER
            - LEFT
          notes: Correlates table-function value arguments with the input row. Function bindings are documented
            in metadata.flowtide_table_functions. The EXTENSION_SINGLE importer unconditionally reads join_condition,
            so provide a boolean true expression for an unconditional join. Omitting it currently fails import.
            The native SQL planner permits an omitted ON clause.
          requires_join_condition_for_import: true
        flowtide.TopNRelation:
          native_relation: TopNRelation
          notes: Incrementally maintains a bounded sorted result with Count and Offset. Use nonnegative Int32 bounds
            and explicit sort fields. Native SQL SELECT TOP ... ORDER BY ... lowers to this extension. Standalone
            SortRel and standard TopNRel are not imported; FetchRel parses but has no executable runtime operator.
            A native fetch without ORDER BY is rejected. Supply the custom TopN relation when importing a bounded
            ordered plan.
          sort_directions:
            - ASC_NULLS_FIRST
            - ASC_NULLS_LAST
            - DESC_NULLS_FIRST
            - DESC_NULLS_LAST
          sql_example: SELECT TOP 10 userkey FROM users ORDER BY userkey DESC
          doc_url: https://koralium.github.io/flowtide/docs/operators/topn.html
        flowtide.BufferRelation:
          native_relation: BufferRelation
          notes: Buffers the input between computation stages.
          doc_url: https://koralium.github.io/flowtide/docs/operators/buffer.html
        flowtide.CheckRelation:
          native_relation: CheckRelation
          requires_column_store: true
          notes: Evaluates check definitions with conditions, messages, tags and optional guards. Guard kinds IS_TRUE,
            IS_NOT_TRUE and IS_NULL are supported. The runtime requires column-store execution.
          guard_kinds:
            - IS_TRUE
            - IS_NOT_TRUE
            - IS_NULL
          doc_url: https://koralium.github.io/flowtide/docs/operators/check.html
      native_only_extensions:
        - protobuf_type: flowtide.NormalizationRelation
          native_relation: NormalizationRelation
          protobuf_serialization: EXTENSION_SINGLE
          protobuf_import: false
          runtime_execution: true
          notes: Native normalization tracks current rows by KeyIndex for upsert/delete semantics and can apply
            a filter. It is inserted by connectors/native planning. The serializer writes this extension, but the
            EXTENSION_SINGLE importer has no handler for it.
          doc_url: https://koralium.github.io/flowtide/docs/operators/normalization.html
      notes: The listed Any detail messages are imported and have runtime implementations. Their per-message restrictions
        below are part of the supported contract.
  - relation: EXTENSION_LEAF
    message_types:
      - type.googleapis.com/flowtide.TableFunctionRelation
      - type.googleapis.com/flowtide.IterationReferenceReadRelation
      - type.googleapis.com/flowtide.StandardOutputTargetReferenceRelation
      - type.googleapis.com/flowtide.SubstreamExchangeReferenceRelation
      - type.googleapis.com/flowtide.PullExchangeReferenceRelation
    metadata:
      messages:
        flowtide.TableFunctionRelation:
          native_relation: TableFunctionRelation
          notes: A table-function source with no input, using table_schema and value arguments. An omitted join_condition
            is accepted for this leaf form. See metadata.flowtide_table_functions.
        flowtide.IterationReferenceReadRelation:
          native_relation: IterationReferenceReadRelation
          notes: Reads feedback from the enclosing named iteration. Supply its output length and a matching iteration
            name; an unbound iteration reference cannot execute.
        flowtide.StandardOutputTargetReferenceRelation:
          native_relation: StandardOutputExchangeReferenceRelation
          notes: Reads the standard-output target of an exchange using its relation/target ids and output length.
        flowtide.SubstreamExchangeReferenceRelation:
          native_relation: SubstreamExchangeReferenceRelation
          notes: Reads a matching substream exchange target using the substream name, target id and output length.
        flowtide.PullExchangeReferenceRelation:
          native_relation: PullExchangeReferenceRelation
          notes: Reads a configured pull exchange target using the substream name, target id and output length.
      notes: The listed source/reference extension messages are supported. Their referenced iterations or exchange
        endpoints must exist in the enclosing stream graph.
  - relation: EXTENSION_MULTI
    message_types:
      - type.googleapis.com/flowtide.IterationRelation
    metadata:
      input_order:
        - LOOP_PLAN
        - OPTIONAL_INITIAL_INPUT
      native_properties_not_serialized:
        - MaxIterations
        - SkipIterateCondition
      notes: Flowtide iteration has the loop plan at inputs[0] and an optional initial input at inputs[1]. Feedback
        uses a matching flowtide.IterationReferenceReadRelation. The protobuf message carries the iteration name;
        native MaxIterations and SkipIterateCondition properties are not serialized.
      doc_url: https://koralium.github.io/flowtide/docs/operators/iteration.html

# Types
# Native value support and protobuf compatibility are described separately in each entry.
supported_types:
  - type: BOOL
    metadata:
      native_model: BoolType
      runtime_value: BoolValue / Boolean
      wire_support:
        schema_import: FULL
        schema_export: FULL
        non_null_literal_import: true
      notes: Boolean values, with null represented separately by validity. BOOLEAN casts and boolean literals are
        supported.
  - type: I32
    metadata:
      native_model: Int32Type
      runtime_value: Int64Value / Int64
      wire_support:
        schema_import: FULL
        schema_export: FULL
        non_null_literal_import: true
      runtime_integer_width: 64
      native_cast_enforces_declared_width: false
      notes: I32 schemas and literals are accepted, but runtime integers use Int64 values. CAST to Int32Type uses
        the same Int64 conversion as Int64Type and does not enforce 32-bit bounds. SQL INT/INTEGER/SMALLINT/TINYINT
        casts and default CLR integer converters resolve to I64. Function support for narrow integer signatures
        must be checked in the function catalogs; physical widening does not imply narrow-width overflow behavior.
  - type: I64
    metadata:
      native_model: Int64Type
      runtime_value: Int64Value / Int64
      wire_support:
        schema_import: FULL
        schema_export: FULL
        non_null_literal_import: true
      runtime_integer_width: 64
      notes: Signed 64-bit integer values. Default CLR byte, sbyte, short, ushort, int, uint and long converters
        use this model. Native integer NumericLiteral values serialize as I64. Function-specific overflow behavior
        is declared separately in the function catalogs.
  - type: FP32
    metadata:
      native_model: Fp32Type
      runtime_value: DoubleValue / Double
      wire_support:
        schema_import: FULL
        schema_export: FULL
        non_null_literal_import: false
      runtime_float_width: 64
      native_cast_enforces_declared_width: false
      notes: FP32 schemas are accepted, but native values and casts use Double without enforcing single-precision
        rounding. The default CLR float converter reports Fp64Type. FP32 literals are not imported. Check the function
        catalogs for supported signatures rather than assuming FP32 arithmetic is implemented.
  - type: FP64
    metadata:
      native_model: Fp64Type
      runtime_value: DoubleValue / Double
      wire_support:
        schema_import: FULL
        schema_export: FULL
        non_null_literal_import: false
      runtime_float_width: 64
      notes: IEEE Double values, including NaN and infinities, are supported natively. Fractional SQL/NumericLiteral
        values evaluate as Double and serialize as FP64 literals, but those literals are not imported by the current
        protobuf expression reader. Connector values and native plans can use them.
  - type: STRING
    metadata:
      native_model: StringType
      runtime_value: StringValue / String
      wire_support:
        schema_import: FULL
        schema_export: FULL
        non_null_literal_import: true
      encoding: UTF-8
      notes: UTF-8 text. Native string values retain UTF-8 bytes; scalar functions determine their own Unicode/case
        behavior. String literals are imported. FixedChar literals are also imported as ordinary strings; this does
        not add FixedChar/Varchar schema support or length enforcement. Default CLR Guid conversion produces a GUID-formatted
        string, not a UUID typed value.
  - type: BINARY
    metadata:
      native_model: BinaryType
      runtime_value: BinaryValue / Binary
      wire_support:
        schema_import: FULL
        schema_export: FULL
        non_null_literal_import: true
      notes: Arbitrary bytes, including binary literals. The FixedBinary schema type is not implemented. parse_guid
        returns 16-byte .NET GUID data in this value kind; the default CLR Guid converter instead uses STRING.
  - type: DECIMAL
    max_precision: 28
    max_scale: 28
    metadata:
      native_model: DecimalType
      runtime_value: DecimalValue / Decimal128 (System.Decimal)
      wire_support:
        schema_import: NONE
        schema_export: PARTIAL
        non_null_literal_import: false
      native_cast_enforces_precision_scale: false
      sql_example: SELECT CAST(123 AS DECIMAL) FROM t
      notes: The Decimal128 runtime tag stores System.Decimal, not arbitrary 38-digit decimal arithmetic. Precision
        28 and scale 0..28 are conservatively advertised; System.Decimal can represent some 29-digit values. Native
        casts do not enforce DecimalType.Precision/Scale or quantize to the declared scale. The protobuf writer
        emits a Decimal type but omits precision/scale (both default to zero), and the reader has no Decimal type
        handler. Decimal type schemas and decimal literals therefore do not round-trip. Use native plans or connector
        values for decimal execution; fractional SQL numeric literals evaluate as Double, so use an explicit decimal cast when
        a decimal value is required.
  - type: PRECISION_TIMESTAMP_TZ
    max_precision: 7
    metadata:
      native_model: TimestampType
      runtime_value: TimestampTzValue / Timestamp
      wire_support:
        schema_import: LEGACY_ONLY
        schema_export: LEGACY_ONLY
        non_null_literal_import: false
      legacy_protobuf_kind: TIMESTAMP_TZ
      tick_nanoseconds: 100
      offset_resolution: MINUTES
      sql_example: SELECT CAST('2026-01-02T03:04:05.1234567+02:00' AS TIMESTAMP) FROM t
      notes: Native timestamps store UTC .NET ticks (100 ns) plus a fixed offset in minutes. Runtime ordering compares
        UTC ticks; offset information is retained when formatting/returning DateTimeOffset values. Use values representable
        by .NET DateTimeOffset. No IANA timezone identifier is stored. CLR DateTime/DateTimeOffset map to TimestampType;
        Unspecified/UTC DateTime input uses zero offset and Local input is converted through DateTimeOffset. The
        bundled protobuf schema and reader/writer use the deprecated timestamp_tz type with no precision parameter;
        modern precision_timestamp_tz fields are unavailable. Timestamp literals are not imported. The max_precision
        here describes native values, not modern precision-type wire support.
  - type: LIST
    metadata:
      native_model: ListType
      runtime_value: ListValue / List
      wire_support:
        schema_import: PARTIAL
        schema_export: FULL
        non_null_literal_import: false
      construction: NESTED_LIST
      sql_example: SELECT list(1, 2, 3) FROM t
      notes: Ordered elements with a declared element type; nullable containers and elements are supported. Dynamic
        heterogeneous lists use Flowtide any as the element type. Construct imported values using NESTED LIST expressions;
        collection literals are not imported. Schema support depends on the element type and its schema context,
        including the nested STRUCT restrictions below.
  - type: MAP
    metadata:
      native_model: MapType
      runtime_value: MapValue / Map
      wire_support:
        schema_import: PARTIAL
        schema_export: FULL
        non_null_literal_import: false
      construction: NESTED_MAP
      notes: Maps have declared key/value types and may contain repeated keys. Substrait map keys must be non-null;
        values may be null. Dynamic values can use Flowtide any. MapValue constructors sort their entries; treat
        maps as unordered. JSON objects from from_json are maps, while named_struct creates STRUCT values. Use NESTED
        MAP expressions for imported construction; map literals are not imported. Schema support depends on both
        child types and their schema context.
  - type: STRUCT
    metadata:
      native_model: NamedStruct with Struct field types
      runtime_value: StructValue / Struct
      wire_support:
        schema_import: PARTIAL
        schema_export: PARTIAL
        non_null_literal_import: false
      standalone_protobuf_codec:
        runtime_extension_urn: extension:io.github.koralium.flowtide:types
        name: named_struct
        parameters: FIELD_NAME_STRINGS_THEN_STRUCT_DATA_TYPE
      native_cast: false
      sql_example: SELECT named_struct('id', 1, 'label', 'item') FROM t
      notes: Named fields with per-field types and nullable values. Native CLR objects and named_struct produce
        struct values. Standard nested Struct schema fields require the flattened name list provided by NamedStruct.
        The READ importer currently calls ParseStruct without that name list, so nested standard structs in ReadRel.base_schema
        (also inside LIST/MAP) fail import. WRITE/table-function schemas use the name-aware parser. Standard Struct
        container nullability is not retained. Standalone type annotations instead use Flowtide user_defined named_struct
        with string field-name parameters followed by a Struct datatype parameter; that wrapper preserves nullability.
        General struct literals and NESTED STRUCT execution are not implemented; use named_struct for native construction.
  - type: USER_DEFINED
    source: flowtide_types
    name: dynamic
    metadata:
      native_model: AnyType
      runtime_value: Dynamically tagged IDataValue
      wire_support:
        schema_import: PARTIAL
        schema_export: FLOWTIDE_CODEC
        non_null_literal_import: false
      runtime_extension_urn: extension:io.github.koralium.flowtide:types
      runtime_type_name: dynamic
      imported_nullability: ALWAYS_NULLABLE
      notes: Flowtide any represents dynamic values, including null and values whose output kind, decimal scale
        or nested shape cannot be fixed by a signature. It serializes as the dynamic type in
        extension:io.github.koralium.flowtide:types. Import always creates nullable AnyType, even when the wire annotation is required. It is a Flowtide
        type codec, not the standard UNBOUND type. Other user-defined names are rejected except named_struct, which
        is the STRUCT annotation wrapper described above.
