%YAML 1.2
---
urn: extension:io.github.koralium.flowtide:struct
description: Flowtide struct construction functions.
dependencies:
  flowtide_types: extension:io.github.koralium.flowtide:types
metadata:
  dialect: ../dialect.yaml
  runtime_binding: References use this extension URN and the function or type name.
scalar_functions:
  - name: create
    description: >-
      named_struct alternates string-literal field names and values, with an even argument count. The schema cannot
      express repeating heterogeneous pairs; any plus this argument-pattern restriction describes the native variadic
      binding.
    metadata:
      runtime_extension_urn: extension:io.github.koralium.flowtide:struct
    impls:
      - args:
          - value: any
        return: flowtide_types.u!dynamic
        nullability: DECLARED_OUTPUT
        variadic:
          min: 2
          parameterConsistency: INCONSISTENT
