%YAML 1.2
---
urn: extension:io.github.koralium.flowtide:functions_string
description: Additional Flowtide string, JSON, and pattern-matching functions and overloads.
dependencies:
  flowtide_types: extension:io.github.koralium.flowtide:types
metadata:
  dialect: ../dialect.yaml
  runtime_binding: References use this extension URN and the function or type name.
scalar_functions:
  - name: trim
    description: >-
      One-argument whitespace trimming. The standard upstream implementation takes an explicit second character-set
      argument.
    metadata:
      runtime_extension_urn: extension:io.github.koralium.flowtide:functions_string
    impls:
      - args:
          - value: string
        return: string?
        nullability: DECLARED_OUTPUT
  - name: ltrim
    description: >-
      One-argument whitespace trimming. The standard upstream implementation takes an explicit second character-set
      argument.
    metadata:
      runtime_extension_urn: extension:io.github.koralium.flowtide:functions_string
    impls:
      - args:
          - value: string
        return: string?
        nullability: DECLARED_OUTPUT
  - name: rtrim
    description: >-
      One-argument whitespace trimming. The standard upstream implementation takes an explicit second character-set
      argument.
    metadata:
      runtime_extension_urn: extension:io.github.koralium.flowtide:functions_string
    impls:
      - args:
          - value: string
        return: string?
        nullability: DECLARED_OUTPUT
  - name: like
    description: >-
      Three-argument LIKE with an explicit escape character. SQL Server-style %/_/bracket patterns are supported.
      Matching is case-sensitive.
    metadata:
      runtime_extension_urn: extension:io.github.koralium.flowtide:functions_string
    impls:
      - args:
          - value: string
          - value: string
          - value: string
        return: boolean?
        nullability: DECLARED_OUTPUT
  - name: string_base64_encode
    description: >-
      Base64 conversion of UTF-8 text. Invalid Base64 input returns null.
    metadata:
      runtime_extension_urn: extension:io.github.koralium.flowtide:functions_string
    impls:
      - args:
          - value: string
        return: string?
        nullability: DECLARED_OUTPUT
  - name: string_base64_decode
    description: >-
      Base64 conversion of UTF-8 text. Invalid Base64 input returns null.
    metadata:
      runtime_extension_urn: extension:io.github.koralium.flowtide:functions_string
    impls:
      - args:
          - value: string
        return: string?
        nullability: DECLARED_OUTPUT
  - name: to_string
    description: >-
      String operation; incompatible input kinds generally yield null.
    metadata:
      runtime_extension_urn: extension:io.github.koralium.flowtide:functions_string
    impls:
      - args:
          - value: any
        return: string?
        nullability: DECLARED_OUTPUT
  - name: to_json
    description: >-
      Serialize a Flowtide value to JSON text.
    metadata:
      runtime_extension_urn: extension:io.github.koralium.flowtide:functions_string
    impls:
      - args:
          - value: any
        return: string?
        nullability: DECLARED_OUTPUT
  - name: from_json
    description: >-
      Parse JSON text or UTF-8 binary into dynamic Flowtide values.
    metadata:
      runtime_extension_urn: extension:io.github.koralium.flowtide:functions_string
    impls:
      - args:
          - value: string
        return: flowtide_types.u!dynamic?
        nullability: DECLARED_OUTPUT
        options:
          error_handling:
            values:
              - ERROR
      - args:
          - value: binary
        return: flowtide_types.u!dynamic?
        nullability: DECLARED_OUTPUT
        options:
          error_handling:
            values:
              - ERROR
  - name: string_join
    description: >-
      Separator is the first argument. Null list returns null; empty/all-null list returns an empty string; null
      elements are skipped.
    metadata:
      runtime_extension_urn: extension:io.github.koralium.flowtide:functions_string
    impls:
      - args:
          - value: string
          - value: list<any>
        return: string?
        nullability: DECLARED_OUTPUT
