%YAML 1.2
---
urn: extension:io.github.koralium.flowtide:functions_guid
description: Flowtide GUID parsing functions.
metadata:
  dialect: ../dialect.yaml
  runtime_binding: References use this extension URN and the function or type name.
scalar_functions:
  - name: parse_guid
    description: >-
      Parse a GUID string into its 16-byte .NET GUID representation. Invalid input returns null; this does not
      generate random GUIDs.
    metadata:
      runtime_extension_urn: extension:io.github.koralium.flowtide:functions_guid
    impls:
      - args:
          - value: string
        return: binary?
        nullability: DECLARED_OUTPUT
