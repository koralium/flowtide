%YAML 1.2
---
urn: extension:io.github.koralium.flowtide:functions_hash
description: Flowtide non-cryptographic hash functions.
metadata:
  dialect: ../dialect.yaml
  runtime_binding: Use legacy_extension_uri metadata and the function name for the current Flowtide runtime. This
    URN identifies the extension document; runtime URN resolution is not added by this documentation.
scalar_functions:
  - name: xxhash64
    description: >-
      Non-cryptographic hash over one or more values. xxhash64 returns signed Int64; xxhash128_guid_string returns
      a GUID-formatted string.
    metadata:
      legacy_extension_uri: /functions_hash.yaml
    impls:
      - args:
          - value: any
        return: i64
        nullability: DECLARED_OUTPUT
        variadic:
          min: 1
          parameterConsistency: INCONSISTENT
  - name: xxhash128_guid_string
    description: >-
      Non-cryptographic hash over one or more values. xxhash64 returns signed Int64; xxhash128_guid_string returns
      a GUID-formatted string.
    metadata:
      legacy_extension_uri: /functions_hash.yaml
    impls:
      - args:
          - value: any
        return: string
        nullability: DECLARED_OUTPUT
        variadic:
          min: 1
          parameterConsistency: INCONSISTENT
