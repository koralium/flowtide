%YAML 1.2
---
urn: extension:io.github.koralium.flowtide:functions_hash
description: Flowtide non-cryptographic hash functions.
metadata:
  dialect: ../dialect.yaml
  runtime_binding: References use this extension URN and the function or type name.
scalar_functions:
  - name: xxhash64
    description: >-
      Non-cryptographic hash over one or more values. xxhash64 returns signed Int64; xxhash128_guid_string returns
      a GUID-formatted string.
    metadata:
      runtime_extension_urn: extension:io.github.koralium.flowtide:functions_hash
    impls:
      - args:
          - value: any
        return: i64
        nullability: DECLARED_OUTPUT
        variadic:
          min: 1
          parameterConsistency: INCONSISTENT
  - name: xxhash128_guid_string
    description: >-
      Non-cryptographic hash over one or more values. xxhash64 returns signed Int64; xxhash128_guid_string returns
      a GUID-formatted string.
    metadata:
      runtime_extension_urn: extension:io.github.koralium.flowtide:functions_hash
    impls:
      - args:
          - value: any
        return: string
        nullability: DECLARED_OUTPUT
        variadic:
          min: 1
          parameterConsistency: INCONSISTENT
