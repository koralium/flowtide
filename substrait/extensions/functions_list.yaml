%YAML 1.2
---
urn: extension:io.github.koralium.flowtide:functions_list
description: Flowtide list functions.
dependencies:
  flowtide_types: extension:io.github.koralium.flowtide:types
metadata:
  dialect: ../dialect.yaml
  runtime_binding: References use this extension URN and the function or type name.
scalar_functions:
  - name: list_sort_asc_null_last
    description: >-
      Sort ascending with nulls last. Non-list input returns null.
    metadata:
      runtime_extension_urn: extension:io.github.koralium.flowtide:functions_list
    impls:
      - args:
          - value: list<any>
        return: list?<any>
        nullability: DECLARED_OUTPUT
  - name: list_first_difference
    description: >-
      First differing element of the first list, or null if none differs.
    metadata:
      runtime_extension_urn: extension:io.github.koralium.flowtide:functions_list
    impls:
      - args:
          - value: list<any>
          - value: list<any>
        return: flowtide_types.u!dynamic?
        nullability: DECLARED_OUTPUT

aggregate_functions:
  - name: list_agg
    description: Collect non-null values, retaining weighted duplicates, in ascending Flowtide value order. Empty/all-null
      groups return an empty list. Aggregate ORDER BY and SQL DISTINCT are rejected.
    metadata:
      runtime_extension_urn: extension:io.github.koralium.flowtide:functions_list
    impls:
      - args:
          - value: any1
        return: list<any1>
        nullability: DECLARED_OUTPUT
        decomposable: NONE
  - name: list_union_distinct_agg
    description: Flatten the input lists and return each distinct element once, in ascending Flowtide value order.
      Null lists are ignored; null elements inside lists are retained once. Empty input returns an empty list. Aggregate
      ORDER BY and SQL DISTINCT are rejected; deduplication is intrinsic to the function.
    metadata:
      runtime_extension_urn: extension:io.github.koralium.flowtide:functions_list
    impls:
      - args:
          - value: list<any1>
        return: list<any1>
        nullability: DECLARED_OUTPUT
        decomposable: NONE
