%YAML 1.2
---
urn: extension:io.github.koralium.flowtide:functions_rounding
description: Additional Flowtide rounding overloads.
metadata:
  dialect: ../dialect.yaml
  runtime_binding: References use this extension URN and the function or type name.
  decimal_precision: System.Decimal; at most 28 digits are conservatively advertised.
scalar_functions:
  - name: round
    description: >-
      One-argument rounding with ties to even, unlike upstream round(value, scale). Double results pass through
      Int64: use finite inputs with an Int64-representable rounded value. Decimal arithmetic uses System.Decimal
      (conservatively at most 28 digits).
    metadata:
      runtime_extension_urn: extension:io.github.koralium.flowtide:functions_rounding
    impls:
      - args:
          - value: i64
        return: i64?
        nullability: DECLARED_OUTPUT
      - args:
          - value: fp64
        return: fp64?
        nullability: DECLARED_OUTPUT
      - args:
          - value: decimal<P,S>
        return: decimal?<P,S>
        nullability: DECLARED_OUTPUT
