syntax = "proto3";

package flowtide;

import "substrait/algebra.proto";
import "substrait/type.proto";
option csharp_namespace = "FlowtideDotNet.Substrait.CustomProtobuf";

message IterationRelation {
    string iterationName = 1;
    // Rows that match are not sent around the loop again.
    substrait.Expression skipIterateCondition = 2;
    // Not set means no limit.
    optional int32 maxIterations = 3;
}

message IterationReferenceReadRelation {
    // Name of the iteration to get data from
    string iterationName = 1;
    int32 outputLength = 2;
}

message NormalizationRelation {
    repeated int32 keyIndex = 1;
    substrait.Expression filter = 2;
    // Set when the relation keeps columns in a row store.
    RowStoreDefinition row_store = 3;
}

// Columns kept in a row store, sent as one reference.
// The enhancement of a named-table ReadRel, and a normalization field.
message RowStoreDefinition {
    // Name of the store.
    string name = 1;
    // Positions in the relation's output, before the store is applied.
    repeated int32 stored_columns = 2;
}

// Reads stored columns back through reference columns.
// Packed into the detail of an extension single rel.
message FetchRequiredColumnsRelation {
    message Fetch {
        // Position of the reference column in the input.
        int32 reference_column = 1;
        // Name of the store the references point into.
        string store_name = 2;
        // Positions in the store's list of stored columns.
        repeated int32 columns = 3;
    }
    repeated Fetch fetches = 1;
}

message BufferRelation {

}

message TopNRelation {
    repeated substrait.SortField sorts = 1;
    int32 offset = 2;
    int32 count = 3;
}

message TableFunction {
    // Points to a function_anchor defined in this plan, which must refer
    // to a table function in the associated YAML file. Required; 0 is
    // considered to be a valid anchor/reference.
    uint32 function_reference = 1;

    // Schema of the output table from the function
    substrait.NamedStruct table_schema = 2;

    // Arguments for the table function
    repeated substrait.FunctionArgument arguments = 7;
}

message TableFunctionRelation {
    // Table function to use
    TableFunction table_function = 1;
    

    // Only required if used with an input.
    // Only left and inner join supported at this time.
    JoinType type = 6;

    // Optional, but only usable with an input.
    substrait.Expression join_condition = 4;

    enum JoinType {
      JOIN_TYPE_UNSPECIFIED = 0;
      JOIN_TYPE_INNER = 1;
      JOIN_TYPE_LEFT = 3;
    }
}

// Primary keys a plan declares for a write relation.
// Packed into the advanced extension enhancement of a WriteRel.
message WriteRelationPrimaryKeys {
    // Column names, always present in the table schema.
    repeated string names = 1;
}

message SubStreamRootRelation {
    // Name of the substream this relation should execute on.
    // Multiple relations can exist that have the same name, then they should all execute on the same substream.
    string substream_name = 1;
}

message PullExchangeReferenceRelation {
    // Name of the substream to fetch data from.
    string substream_name = 1;

    // Identifier that is used when fetching data from the other stream.
    int32 exchange_target_id = 2;

    // Number of output columns.
    int32 output_length = 3;
}

message SubstreamExchangeReferenceRelation {
    // Name of the substream to fetch data from.
    string substream_name = 1;

    // Identifier that is used when fetching data from the other substream.
    int32 exchange_target_id = 2;

    // Number of output columns.
    int32 output_length = 3;
}

// A reference that carries an emit or hints.
// Packed into the detail of an extension leaf rel.
message ReferenceRelation {
    int32 relation_id = 1;
}

message StandardOutputTargetReferenceRelation {
    int32 relation_id = 1;
    int32 target_id = 2;
}

// Packed into the extended field of an exchange target when the target sends its data to
// another substream.
message SubstreamExchangeTarget {
    // Name of the substream the data is sent to.
    string substream_name = 1;

    // Identifier used by the other substream when it fetches the data.
    int32 exchange_target_id = 2;
}

// Packed into the extended field of an exchange target when the target stores its data in a
// bucket that is pulled by the target.
message PullBucketExchangeTarget {
    // Identifier used when the data is pulled.
    int32 exchange_target_id = 1;
}

// A relation's hints, such as a read's watermark mode.
// Packed into the optimization of a relation hint's advanced extension.
message HintOptimizations {
    map<string, string> properties = 1;
}

// Marks a merge join as part of a multi join, every join of one group carries the same group.
// Packed into the optimization of a merge join's advanced extension.
message MultiJoinHint {
    int32 group = 1;
}

// Passes its input through and tracks the issues raised by its checks.
// Packed into the detail of an extension single rel.
message CheckRelation {
    repeated Check checks = 1;

    message Check {
        // Raises an issue when it evaluates to boolean false.
        substrait.Expression condition = 1;

        // Check name template, placeholders like {tag} are left unrendered.
        string message = 2;

        repeated Tag tags = 3;

        // Must all hold before the check is evaluated, empty means always.
        repeated Guard guards = 4;
    }

    message Tag {
        string key = 1;
        substrait.Expression value = 2;
    }

    message Guard {
        substrait.Expression expression = 1;
        Kind kind = 2;

        enum Kind {
            // The expression is true, the CASE branch was taken.
            KIND_IS_TRUE = 0;
            // The expression is not true, an earlier CASE branch was not taken.
            KIND_IS_NOT_TRUE = 1;
            // The expression is null, an earlier COALESCE argument was null.
            KIND_IS_NULL = 2;
        }
    }
}